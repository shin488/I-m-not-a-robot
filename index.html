<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>私はロボットではありません</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" id="app">
  <button class="theme-toggle" id="themeToggle">🌙</button>
  <h1>私はロボットではありません</h1>
  <div class="badge">🔒 reCAPTCHA v3.14（嘘）</div>

  <div id="captchaArea">
    <div class="test-label" id="testLabel"></div>
    <div class="captcha-box" id="captchaBox">
      <div class="timer-bar"><div class="timer-bar-inner" id="timerBar"></div></div>
      <div class="prompt" id="prompt"></div>
      <div class="image-grid" id="grid"></div>
      <button class="verify-btn" id="verifyBtn" disabled>確認</button>
    </div>
    <div class="counter" id="counter">1 回目の挑戦</div>
    <div class="stats" id="stats"></div>
    <div class="human-meter" id="humanMeter">
      <span>👤 人間度</span>
      <div class="meter-bar"><div class="meter-bar-inner" id="meterInner" style="width:0%"></div></div>
    </div>
    <div class="message" id="message"></div>
    <button class="give-up-btn" id="giveUpBtn">人間じゃなくてもいいや</button>
  </div>

  <div class="final-message" id="finalMessage">
    <div class="big">🎉</div>
    <div class="text">ついに人間になりました！</div>
    <div class="sub">おめでとうございます。あなたは正式にホモ・サピエンスとして認定されました。</div>
  </div>

  <div class="fake-popup" id="fakePopup">
    <div class="popup-content">
      <div class="popup-title" id="popupTitle">⚠️ 警告</div>
      <div class="popup-body" id="popupBody">エラーが発生しました。</div>
      <button class="popup-btn" id="popupBtn">OK</button>
    </div>
  </div>

  <div class="reset-link"><a id="resetLink">最初からやり直す</a></div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">分析中…</div>
    <div class="loading-sub" id="loadingSub"></div>
  </div>
</div>

<div class="confetti-container" id="confettiContainer"></div>

<script src="script.js"></script>
</body>
</html>
